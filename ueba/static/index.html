<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UEBA behavioural verification</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg: #10161d;
      --panel: #18212b;
      --raised: #1f2a36;
      --line: #2a3644;
      --text: #e4ebf2;
      --muted: #8b99a8;
      --accent: #5aa7ff;
      --ok: #3fb950;
      --warn: #d6a02a;
      --bad: #f2564d;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 20px 20px 64px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    header h1 {
      font-size: 19px;
      margin: 0;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    header p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .strip {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chip {
      font-size: 12px;
      padding: 3px 9px;
      border-radius: 4px;
      background: var(--raised);
      color: var(--muted);
      border: 1px solid var(--line);
    }

    .chip b {
      color: var(--text);
      font-weight: 500;
    }

    .chip.live {
      border-color: rgba(63, 185, 80, .45);
    }

    .chip.down {
      border-color: rgba(242, 86, 77, .5);
    }

    nav {
      display: flex;
      gap: 2px;
      margin: 14px 0 22px;
    }

    nav button {
      background: none;
      border: 1px solid transparent;
      color: var(--muted);
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      font: inherit;
    }

    nav button:hover {
      color: var(--text);
    }

    nav button.on {
      color: var(--text);
      background: var(--panel);
      border-color: var(--line);
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 18px;
      align-items: start;
    }

    .grid.even {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    }

    @media (max-width: 860px) {

      .grid,
      .grid.even {
        grid-template-columns: 1fr;
      }
    }

    .stack {
      display: grid;
      gap: 14px;
    }

    .sticky {
      position: sticky;
      top: 16px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 18px;
    }

    .panel.dim {
      opacity: .5;
      pointer-events: none;
    }

    .step-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 12px;
    }

    .step-num {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 12px;
      background: var(--raised);
      border: 1px solid var(--line);
      color: var(--muted);
      flex: none;
    }

    .step-num.done {
      background: rgba(63, 185, 80, .15);
      border-color: rgba(63, 185, 80, .5);
      color: var(--ok);
    }

    h2 {
      font-size: 15px;
      margin: 0;
      font-weight: 600;
    }

    .hint {
      color: var(--muted);
      font-size: 12.5px;
      margin: 8px 0 0;
      line-height: 1.55;
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin: 0 0 5px;
    }

    input,
    select {
      width: 100%;
      background: #0c1117;
      border: 1px solid var(--line);
      color: var(--text);
      padding: 9px 11px;
      border-radius: 6px;
      font: inherit;
    }

    input:focus,
    select:focus,
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
      border-color: transparent;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    @media (max-width: 520px) {
      .row {
        grid-template-columns: 1fr;
      }
    }

    button.go {
      background: var(--accent);
      color: #06111d;
      border: none;
      padding: 9px 16px;
      border-radius: 6px;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
    }

    button.ghost {
      background: var(--raised);
      color: var(--text);
      border: 1px solid var(--line);
      padding: 9px 14px;
      border-radius: 6px;
      cursor: pointer;
      font: inherit;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .phrase {
      font-family: var(--mono);
      font-size: 16px;
      padding: 12px 14px;
      background: #0c1117;
      border: 1px solid var(--line);
      border-radius: 6px;
      margin-bottom: 10px;
      letter-spacing: .02em;
    }

    .phrase .ok {
      color: var(--ok);
    }

    .phrase .bad {
      color: var(--bad);
      text-decoration: underline;
    }

    .phrase .rest {
      color: var(--muted);
    }

    .dots {
      display: flex;
      gap: 5px;
      margin: 10px 0 0;
    }

    .dot {
      flex: 1;
      max-width: 34px;
      height: 5px;
      border-radius: 3px;
      background: #2c3846;
    }

    .dot.done {
      background: var(--ok);
    }

    .dot.warm {
      background: #4a5868;
    }

    .arena {
      position: relative;
      height: 112px;
      margin-top: 12px;
      border-radius: 6px;
      border: 1px dashed var(--line);
      background: #0c1117;
    }

    .arena .go {
      position: absolute;
      transform: translate(-50%, -50%);
    }

    .tracepad {
      position: relative;
      width: 100%;
      max-width: 560px;
      aspect-ratio: 2 / 1;
      background: #0c1117;
      border: 1px solid var(--line);
      border-radius: 8px;
      touch-action: none;
      cursor: crosshair;
      user-select: none;
    }

    .tracepad svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .check {
      display: grid;
      gap: 9px;
      margin: 4px 0 12px;
    }

    .check div {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
    }

    .check span:first-child {
      color: var(--muted);
    }

    .num {
      font-variant-numeric: tabular-nums;
    }

    .good {
      color: var(--ok);
    }

    .warn {
      color: var(--warn);
    }

    .badc {
      color: var(--bad);
    }

    .pill {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 600;
      background: #253140;
      color: var(--muted);
    }

    .pill.PASSED,
    .pill.OK,
    .pill.LOW {
      background: rgba(63, 185, 80, .16);
      color: var(--ok);
    }

    .pill.MEDIUM,
    .pill.PARTIAL,
    .pill.WARMING_UP {
      background: rgba(214, 160, 42, .16);
      color: var(--warn);
    }

    .pill.FAILED,
    .pill.HIGH,
    .pill.MISSING,
    .pill.UNAVAILABLE {
      background: rgba(242, 86, 77, .16);
      color: var(--bad);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th {
      text-align: left;
      font-weight: 500;
      color: var(--muted);
      font-size: 12px;
      padding: 7px 8px;
      border-bottom: 1px solid var(--line);
    }

    td {
      padding: 8px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    .mono {
      font-family: var(--mono);
      font-size: 12px;
    }

    .scorebar {
      position: relative;
      height: 12px;
      border-radius: 6px;
      margin: 26px 0 8px;
      background: linear-gradient(90deg, rgba(242, 86, 77, .28) 0 70%,
          rgba(214, 160, 42, .3) 70% 80.5%,
          rgba(63, 185, 80, .3) 80.5% 100%);
    }

    .scorebar .mark {
      position: absolute;
      top: -18px;
      transform: translateX(-50%);
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    .scorebar .tick {
      position: absolute;
      top: -3px;
      bottom: -3px;
      width: 1px;
      background: var(--muted);
    }

    .scorebar .needle {
      position: absolute;
      top: -5px;
      width: 4px;
      height: 22px;
      border-radius: 2px;
      background: var(--text);
      transform: translateX(-50%);
    }

    .scale {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
    }

    .big {
      font-size: 28px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .err {
      color: var(--bad);
      font-size: 13px;
      margin-top: 10px;
    }

    .flags {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 14px;
      margin-top: 12px;
    }

    .flags div {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
    }

    .flags span:first-child {
      color: var(--muted);
    }

    .filter {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }

    @media (prefers-reduced-motion: no-preference) {
      .needle {
        transition: left .35s ease-out;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback } = React;
    const API = "";

    const get = (p) => fetch(API + p).then(async r => ({ ok: r.ok, status: r.status, data: await r.json() }));
    const post = (p, body) => fetch(API + p, {
      method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
    })
      .then(async r => ({ ok: r.ok, status: r.status, data: await r.json() }));
    const errText = (d) => typeof d?.detail === "string" ? d.detail
      : Array.isArray(d?.detail) ? d.detail.map(x => x.msg).join("; ") : "Request failed";

    /* Capture ------------------------------------------------------------ */

    // Keystroke timing. On a laptop each key event names its key. Phone
    // keyboards (Android especially) send key "Unidentified" (keyCode 229)
    // for every letter, so the key is recovered from what the press did to
    // the text box: the input event that follows it. Timing still comes from
    // the key events. Without this every phone sample matched 0 positions of
    // the phrase and enrolment failed with "didn't match the phrase".
    function useKeystroke() {
      const down = useRef({});          // named keys: key -> press time
      const pend = useRef([]);          // unnamed presses waiting for a key and/or release
      const events = useRef([]);
      const val = useRef("");
      const blindSeen = useRef(false);
      const now = () => Math.round(performance.now() * 100) / 100;
      const blind = (e) => e.key === "Unidentified" || e.key === "Process" || e.keyCode === 229;

      const flush = () => {
        const done = pend.current.filter(q => q.key !== null && q.up !== null);
        pend.current = pend.current.filter(q => !(q.key !== null && q.up !== null));
        done.forEach(q => events.current.push(q));
      };
      const onKeyDown = (e) => {
        if (e.key === "Enter" || e.repeat) return;
        if (blind(e)) {
          blindSeen.current = true;
          pend.current.push({ key: null, down: now(), up: null });
          return;
        }
        if (down.current[e.key] !== undefined) return;
        down.current[e.key] = now();
      };
      const onKeyUp = (e) => {
        if (blind(e)) {
          const q = pend.current.find(q => q.up === null);
          if (q) { q.up = now(); flush(); }
          return;
        }
        const t = down.current[e.key];
        if (t === undefined) return;
        events.current.push({ key: e.key, down: t, up: now() });
        delete down.current[e.key];
      };
      // What the last unnamed press typed: the difference between the text
      // before and after it. Named keys were recorded already and are left alone.
      // The text belongs to the most recent press: a key that typed nothing
      // (Shift, the switch to the number keyboard) stays unnamed and is dropped,
      // instead of taking the next letter and shifting every later timing.
      const onInput = (e) => {
        const v = e.target.value, old = val.current;
        val.current = v;
        const open = pend.current.filter(q => q.key === null);
        const q = open[open.length - 1];
        if (!q) return;
        let a = 0;
        while (a < old.length && a < v.length && old[a] === v[a]) a++;
        let b = 0;
        while (b < old.length - a && b < v.length - a &&
               old[old.length - 1 - b] === v[v.length - 1 - b]) b++;
        const removed = old.length - a - b, added = v.slice(a, v.length - b);
        // A word swapped by autocorrect arrives as several characters from one
        // press: they keep their place in the text, with that press's timing.
        const extra = [];
        for (let i = 0; i < removed; i++) extra.push("Backspace");
        for (const ch of added) extra.push(ch);
        if (!extra.length) return;
        q.key = extra[0];
        extra.slice(1).forEach(k => events.current.push({ key: k, down: q.down, up: q.down }));
        flush();
      };
      const reset = () => {
        events.current = []; down.current = {}; pend.current = []; val.current = "";
        blindSeen.current = false;
      };
      const get = () => {
        // A press whose release never arrived keeps zero hold time.
        const late = pend.current.filter(q => q.key !== null).map(q => ({ ...q, up: q.up ?? q.down }));
        return [...events.current, ...late].sort((x, y) => x.down - y.down);
      };
      return { onKeyDown, onKeyUp, onInput, reset, get, blindSeen };
    }

    // Mouse-only pointer capture for free-movement mouse dynamics. Touches are
    // left out deliberately: they are a different motor signal.
    function usePointerCapture() {
      const points = useRef([]);
      const clicks = useRef([]);
      const downAt = useRef(null);
      useEffect(() => {
        let last = 0;
        const move = (e) => {
          if (e.pointerType !== "mouse") return;
          const t = performance.now();
          if (t - last < 16) return;
          last = t;
          points.current.push({ x: e.clientX, y: e.clientY, t: Math.round(t * 100) / 100 });
        };
        const pd = (e) => { if (e.pointerType === "mouse") downAt.current = performance.now(); };
        const pu = (e) => {
          if (e.pointerType !== "mouse" || downAt.current === null) return;
          clicks.current.push({ down: downAt.current, up: performance.now() });
          downAt.current = null;
        };
        window.addEventListener("pointermove", move);
        window.addEventListener("pointerdown", pd);
        window.addEventListener("pointerup", pu);
        return () => {
          window.removeEventListener("pointermove", move);
          window.removeEventListener("pointerdown", pd);
          window.removeEventListener("pointerup", pu);
        };
      }, []);
      const snapshot = () => { const p = points.current.slice(); points.current = []; return p; };
      const reset = () => { points.current = []; clicks.current = []; };
      return { points, clicks, snapshot, reset };
    }

    function useSession() {
      const start = useRef(Date.now() / 1000);
      const actions = useRef([]);
      const mark = useCallback(() => { actions.current.push(Date.now() / 1000); }, []);
      const payload = () => ({
        start: start.current, end: Date.now() / 1000,
        actions: actions.current.slice()
      });
      return { mark, payload };
    }

    const capability = () => ({
      pointer: window.matchMedia("(pointer: fine)").matches,
      touch: (navigator.maxTouchPoints || 0) > 0,
    });

    // Which template set to use on this device: "touch" for a phone or tablet,
    // "keyboard" for a physical keyboard with a mouse or trackpad. Only a
    // starting guess; the person can change it, and the service checks every
    // sample against it.
    const guessInput = () =>
      window.matchMedia("(pointer: coarse)").matches && (navigator.maxTouchPoints || 0) > 0
        ? "touch" : "keyboard";
    const INPUT_LABEL = { keyboard: "Keyboard and mouse", touch: "Touchscreen" };
    const POINTER_INPUT = { mouse: "keyboard", touch: "touch" };

    function InputPicker({ value, onChange, disabled }) {
      return (
        <div className="filter" role="radiogroup" aria-label="Input">
          {["keyboard", "touch"].map(k =>
            <button key={k} className={value === k ? "go" : "ghost"} disabled={disabled}
              aria-pressed={value === k} onClick={() => onChange(k)}>{INPUT_LABEL[k]}</button>)}
        </div>
      );
    }

    // Phone keyboards that predict or correct words break the timing; these
    // attributes ask them not to, though some keyboards ignore them.
    const plainText = { autoComplete: "off", autoCorrect: "off", autoCapitalize: "off",
                        spellCheck: "false" };

    /* Pieces ------------------------------------------------------------- */

    function PhraseEcho({ phrase, typed }) {
      let i = 0;
      while (i < typed.length && typed[i] === phrase[i]) i++;
      const wrong = typed.length > i ? phrase.slice(i, Math.min(typed.length, phrase.length)) : "";
      const rest = phrase.slice(i + wrong.length);
      return (
        <div className="phrase" aria-label={"Type: " + phrase}>
          <span className="ok">{phrase.slice(0, i)}</span>
          <span className="bad">{wrong}</span>
          <span className="rest">{rest}</span>
        </div>
      );
    }

    // Pointer Events cover mouse, pen and touch with one code path, so the trace
    // works as a finger drag on phones. The pad is locked to the shape's aspect
    // ratio: a stretched pad would make enrollment and verification different
    // shapes, and the 60 degree slopes are only 60 degrees at 2:1.
    function TracePad({ shape, aspect, onTrace, requireEnds, input }) {
      const ref = useRef(null);
      const pts = useRef([]);
      const kind = useRef(null);
      const active = useRef(false);
      const [drawn, setDrawn] = useState([]);
      const [msg, setMsg] = useState("");

      const norm = (e) => {
        const r = ref.current.getBoundingClientRect();
        return {
          x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height,
          t: Math.round(performance.now() * 100) / 100
        };
      };
      const near = (p, q) => Math.hypot((p.x - q[0]) * aspect, p.y - q[1]) < 0.16;

      const down = (e) => {
        e.preventDefault();
        if (e.pointerType === "pen") { setMsg("A stylus isn't supported yet. Use your finger or a mouse."); return; }
        if (input && POINTER_INPUT[e.pointerType] !== input) {
          setMsg(input === "touch" ? "This is set up for a touchscreen: trace with your finger."
            : "This is set up for keyboard and mouse: trace with the mouse or trackpad.");
          return;
        }
        kind.current = e.pointerType;
        ref.current.setPointerCapture(e.pointerId);
        active.current = true;
        pts.current = [norm(e)];
        setDrawn(pts.current.slice());
        setMsg("");
      };
      const move = (e) => {
        if (!active.current) return;
        pts.current.push(norm(e));
        if (pts.current.length % 2 === 0) setDrawn(pts.current.slice());
      };
      const up = () => {
        if (!active.current) return;
        active.current = false;
        const tr = pts.current.slice();
        setDrawn([]);
        if (requireEnds) {
          if (tr.length < 10) { setMsg("Too short. Trace the whole line."); return; }
          if (!near(tr[0], shape[0]) || !near(tr[tr.length - 1], shape[shape.length - 1])) {
            setMsg("Start on the green dot and finish on the red one.");
            return;
          }
        }
        onTrace(tr, kind.current);
      };

      const W = 200, H = 200 / aspect;
      const line = shape.map(([x, y], i) => `${i ? "L" : "M"}${x * W} ${y * H}`).join(" ");
      const user = drawn.map((p, i) => `${i ? "L" : "M"}${p.x * W} ${p.y * H}`).join(" ");
      const [s0, s1] = [shape[0], shape[shape.length - 1]];

      return (
        <div>
          <div className="tracepad" ref={ref} onPointerDown={down} onPointerMove={move}
            onPointerUp={up} onPointerCancel={up} role="img"
            aria-label="Trace pad: drag from the green dot to the red dot along the line">
            <svg viewBox={`0 0 ${W} ${H}`}>
              <path d={line} fill="none" stroke="#34465a" strokeWidth="4" strokeLinejoin="round"
                strokeLinecap="round" />
              <circle cx={s0[0] * W} cy={s0[1] * H} r="4" fill="#3fb950" />
              <circle cx={s1[0] * W} cy={s1[1] * H} r="4" fill="#f2564d" />
              {user && <path d={user} fill="none" stroke="#5aa7ff" strokeWidth="1.6"
                strokeLinejoin="round" strokeLinecap="round" />}
            </svg>
          </div>
          {msg && <div className="err">{msg}</div>}
        </div>
      );
    }

    function Dots({ total, done, warm = 0 }) {
      return (
        <div className="dots" aria-label={`${done} of ${total} recorded`}>
          {Array.from({ length: total }).map((_, i) =>
            <div key={i} className={"dot" + (i < done ? (i < warm ? " warm" : " done") : "")} />)}
        </div>
      );
    }

    function Step({ n, title, done, dim, children }) {
      return (
        <section className={"panel" + (dim ? " dim" : "")}>
          <div className="step-head">
            <div className={"step-num" + (done ? " done" : "")}>{done ? "✓" : n}</div>
            <h2>{title}</h2>
          </div>
          {children}
        </section>
      );
    }

    function ScoreBar({ score, threshold }) {
      const pos = (v) => `${Math.max(0, Math.min(1, v)) * 100}%`;
      const marginal = Math.min(1, threshold * 1.15);
      return (
        <div>
          <div className="scorebar" style={{
            background:
              `linear-gradient(90deg, rgba(242,86,77,.28) 0 ${pos(threshold)},
          rgba(214,160,42,.3) ${pos(threshold)} ${pos(marginal)},
          rgba(63,185,80,.3) ${pos(marginal)} 100%)`
          }}>
            <span className="mark" style={{ left: pos(threshold) }}>pass at {threshold}</span>
            <span className="tick" style={{ left: pos(threshold) }} />
            {score !== null && <span className="needle" style={{ left: pos(score) }} />}
          </div>
          <div className="scale"><span>0</span><span>marginal below {marginal.toFixed(3)}</span><span>1</span></div>
        </div>
      );
    }

    /* Enroll ------------------------------------------------------------- */

    function Enroll({ meta, session, goTransact }) {
      const [userId, setUserId] = useState("");
      const [input, setInput] = useState(guessInput());
      const [typed, setTyped] = useState("");
      const [samples, setSamples] = useState([]);
      const [segments, setSegments] = useState([]);
      const [traces, setTraces] = useState([]);
      const [kinds, setKinds] = useState([]);
      const [target, setTarget] = useState({ top: 56, left: 50 });
      const [result, setResult] = useState(null);
      const [error, setError] = useState("");
      const [busy, setBusy] = useState(false);
      const kb = useKeystroke();
      const ptr = usePointerCapture();
      const inputRef = useRef(null);

      // Practice rounds are not recorded. A cold template captures someone still
      // learning an unfamiliar phrase and shape; in testing, cold enrollments
      // failed their owner and a warmed-up one passed four times out of four.
      const PT = 3, PS = 2;            // practice typings, practice traces
      const [pt, setPt] = useState(0);
      const [ps, setPs] = useState(0);
      const practising = pt < PT;

      const reps = meta.repetitions, needTraces = meta.shapeTracesRequired;
      const typingDone = samples.length >= reps, shapeDone = traces.length >= needTraces;

      const submitSample = () => {
        if (typed !== meta.phrase) { setError("The text doesn't match the phrase yet."); return; }
        // Read the captures before queuing the updates. React runs updater
        // functions later, by which time kb.reset() below has emptied them.
        const ev = kb.get(), seg = ptr.snapshot();
        if (practising) setPt(n => n + 1);
        else { setSamples(s => [...s, ev]); setSegments(g => [...g, seg]); }
        kb.reset(); setTyped(""); setError(""); session.mark();
        setTarget({ top: 28 + Math.random() * 56, left: 14 + Math.random() * 72 });
        inputRef.current?.focus();
      };

      const finish = async () => {
        setBusy(true); setError("");
        const desk = input === "keyboard";
        const r = await post("/enroll", {
          userId: userId.trim(), input, keystrokeSamples: samples,
          shapeTraces: traces, shapePointerTypes: kinds,
          mouseSegments: desk ? segments.filter(s => s.length) : [],
          mouseClicks: desk ? ptr.clicks.current : []
        });
        setBusy(false);
        if (!r.ok) { setError(errText(r.data)); return; }
        setResult(r.data);
      };

      const restart = () => {
        setResult(null); setSamples([]); setSegments([]); setTraces([]); setKinds([]);
        setTyped(""); setUserId(""); setPt(0); setPs(0);
        kb.reset(); ptr.reset();
      };

      if (result) return (
        <div className="grid even">
          <section className="panel">
            <div className="step-head"><div className="step-num done">✓</div>
              <h2>{result.userId} is enrolled for {INPUT_LABEL[result.input].toLowerCase()}</h2></div>
            <div className="check">
              <div><span>Template sets</span><span>
                {result.enrolledInputs.map(k => INPUT_LABEL[k]).join(" and ")}</span></div>
              <div><span>Typing template</span><span className="num">
                {result.keystroke.samples} of {result.keystroke.recorded} recordings used</span></div>
              <div><span>Typing compares</span><span>{result.keystroke.compares.includes("dwell")
                ? "key hold times and gaps between keys" : "gaps between key presses"}</span></div>
              <div><span>Mean key hold</span><span className="num">{result.keystroke.meanDwellMs} ms</span></div>
              <div><span>Typing speed</span><span className="num">{result.keystroke.typingSpeedCps} chars/s</span></div>
              <div><span>Shape template</span><span className="num">
                {result.shape.samples} traces, {result.shape.checkpoints} checkpoints</span></div>
              {result.input === "keyboard" &&
                <div><span>Mouse template</span><span className={result.mouse.status === "ENROLLED" ? "" : "warn"}>
                  {result.mouse.status === "ENROLLED" ? `${result.mouse.samples} segments, not scored`
                    : "not enough movement, not scored"}</span></div>}
              <div><span>Session profile</span><span>builds up with approved transactions</span></div>
            </div>
            <div className="actions">
              <button className="go" onClick={goTransact}>Run a transaction</button>
              <button className="ghost" onClick={restart}>Enrol someone else or another device type</button>
            </div>
          </section>
        </div>
      );

      return (
        <div className="grid">
          <div className="stack">
            <Step n={1} title="Who is enrolling" done={!!userId.trim()}>
              <label htmlFor="uid">User ID</label>
              <input id="uid" value={userId} onChange={e => setUserId(e.target.value)}
                placeholder="e.g. devdeep" {...plainText} />
              <label style={{ marginTop: 12 }}>This device</label>
              <InputPicker value={input} disabled={samples.length > 0 || traces.length > 0 || pt > 0 || ps > 0}
                onChange={setInput} />
              <p className="hint">Laptop and phone get separate templates: thumb typing and
                finger tracing differ from a keyboard and mouse. Enrolling one keeps the other.</p>
            </Step>

            <Step n={2} title={`Type the phrase ${reps} times`} done={typingDone}>
              <PhraseEcho phrase={meta.phrase} typed={typed} />
              {!typingDone && <p className="hint" style={{ margin: "0 0 8px" }}>
                {practising ? `Practice ${pt + 1} of ${PT}, not saved`
                  : `Recording ${samples.length + 1} of ${reps}`}</p>}
              <input ref={inputRef} value={typed} {...plainText}
                disabled={typingDone} aria-label="Type the phrase"
                onChange={e => setTyped(e.target.value)} onInput={kb.onInput}
                onKeyDown={e => { kb.onKeyDown(e); if (e.key === "Enter") submitSample(); }}
                onKeyUp={kb.onKeyUp}
                placeholder={typingDone ? "All recordings captured" : "Type here"} />
              <Dots total={reps} done={samples.length} warm={Math.min(samples.length, meta.discarded)} />
              {!typingDone && (
                <div className="arena">
                  <button className="go" style={{ top: target.top + "%", left: target.left + "%" }}
                    onClick={submitSample} disabled={!typed}>
                    {practising ? "Next practice" : "Save recording"}</button>
                </div>
              )}
              <p className="hint">
                The first {PT} typings are practice and aren't saved, and the first saved
                recording is discarded too: on an unfamiliar phrase people type more slowly at
                first. Mistakes you correct with backspace are fine. The button moves each time
                so your pointer movement varies between recordings.
                {input === "touch" && " On a phone, type each letter yourself: if your keyboard suggests or corrects words, turn that off for this test."}
              </p>
            </Step>

            <Step n={3} title={`Trace the shape ${needTraces} times`} done={shapeDone}>
              {meta.shape && !shapeDone && (
                <TracePad shape={meta.shape} aspect={meta.aspectRatio} requireEnds input={input}
                  onTrace={(tr, k) => {
                    if (ps < PS) setPs(n => n + 1);
                    else { setTraces(t => [...t, tr]); setKinds(x => [...x, k]); }
                    session.mark();
                  }} />
              )}
              {!shapeDone && <p className="hint" style={{ margin: "8px 0 0" }}>
                {ps < PS ? `Practice ${ps + 1} of ${PS}, not saved`
                  : `Trace ${traces.length + 1} of ${needTraces}`}</p>}
              <Dots total={needTraces} done={traces.length} />
              <p className="hint">
                The first {PS} traces are practice. Hold down and drag from the green dot to
                the red one, following the line. How
                closely you track it, your pace, and how you take the two corners is what
                identifies you. {input === "touch" ? "Use your finger." : "Use the mouse or trackpad."}
              </p>
              {traces.length > 0 && !shapeDone &&
                <div className="actions"><button className="ghost"
                  onClick={() => { setTraces(t => t.slice(0, -1)); setKinds(x => x.slice(0, -1)); }}>
                  Discard last trace</button></div>}
            </Step>
          </div>

          <aside className="panel sticky">
            <h2 style={{ marginBottom: 12 }}>Enrollment</h2>
            <div className="check">
              <div><span>User ID</span><span>{userId.trim() || "not set"}</span></div>
              <div><span>Device type</span><span>{INPUT_LABEL[input]}</span></div>
              <div><span>Typing</span><span className={"num " + (typingDone ? "good" : "")}>
                {samples.length} / {reps}</span></div>
              <div><span>Shape traces</span><span className={"num " + (shapeDone ? "good" : "")}>
                {traces.length} / {needTraces}</span></div>
            </div>
            <button className="go" style={{ width: "100%" }} onClick={finish}
              disabled={busy || !userId.trim() || !typingDone || !shapeDone}>
              {busy ? "Enrolling" : "Enrol"}
            </button>
            {error && <div className="err">{error}</div>}
            <p className="hint">Templates store timing and tracing statistics only, never a
              recording of what you typed or drew.</p>
          </aside>
        </div>
      );
    }

    /* Transact ----------------------------------------------------------- */

    const newTxn = () => "txn_" + Math.random().toString(36).slice(2, 10);

    function Transact({ session }) {
      const [form, setForm] = useState({
        userId: "", amount: "5000", payeeId: "b_1",
        deviceId: "d_1", ip: "103.21.45.67", channel: "WEB"
      });
      const [txn, setTxn] = useState(newTxn());
      const [input, setInput] = useState(guessInput());
      const [tester, setTester] = useState("");
      const [preview, setPreview] = useState(null);
      const [challenge, setChallenge] = useState(null);
      const [typed, setTyped] = useState("");
      const [trace, setTrace] = useState(null);
      const [traceKind, setTraceKind] = useState(null);
      const [result, setResult] = useState(null);
      const [commit, setCommit] = useState(null);
      const [error, setError] = useState("");
      const [busy, setBusy] = useState(false);
      const [target, setTarget] = useState({ top: 52, left: 50 });
      const kb = useKeystroke();
      const ptr = usePointerCapture();
      const set = (k) => (e) => setForm(f => ({ ...f, [k]: e.target.value }));

      const assess = async () => {
        setBusy(true); setError(""); session.mark();
        const r = await post("/risk/preview", {
          userId: form.userId.trim(), transactionId: txn,
          amountPaise: Math.round(parseFloat(form.amount || "0") * 100), payeeId: form.payeeId,
          deviceId: form.deviceId, ip: form.ip, channel: form.channel,
          timestamp: new Date().toISOString(), session: session.payload()
        });
        if (!r.ok) { setBusy(false); setError(errText(r.data)); return; }
        const c = await get("/factor/challenge?userId=" + encodeURIComponent(form.userId.trim()) +
          "&input=" + input);
        setBusy(false);
        if (!c.ok) { setError(errText(c.data)); return; }
        setPreview(r.data); setChallenge(c.data);
        kb.reset(); ptr.reset();
        setTarget({ top: 28 + Math.random() * 56, left: 14 + Math.random() * 72 });
      };

      // Submitting with nothing typed or traced is allowed on purpose: a
      // skipped challenge is scored as missing, not quietly ignored.
      const verify = async () => {
        setBusy(true); setError(""); session.mark();
        const r = await post("/factor/verify", {
          sessionId: "demo_" + txn, userId: form.userId.trim(),
          transactionId: txn, challengeId: challenge.challengeId,
          testerId: tester.trim() || null,
          payload: {
            keystroke: kb.get(), shapeTrace: trace || [],
            keystrokeInput: input, shapePointerType: traceKind,
            pointer: input === "keyboard" ? { points: ptr.points.current, clicks: ptr.clicks.current }
              : { points: [], clicks: [] },
            capability: capability()
          }
        });
        setBusy(false);
        if (!r.ok) { setError(errText(r.data)); return; }
        setResult(r.data);
      };

      const record = async (outcome) => {
        setBusy(true);
        const r = await post("/profile/commit", { transactionId: txn, outcome });
        setBusy(false);
        if (!r.ok) { setError(errText(r.data)); return; }
        setCommit(r.data);
      };

      const again = () => {
        setTxn(newTxn()); setPreview(null); setChallenge(null); setTyped("");
        setTrace(null); setTraceKind(null); setResult(null); setCommit(null); setError("");
      };

      const yn = (v) => v === null || v === undefined ? "unknown" : v ? "yes" : "no";

      return (
        <div className="grid even">
          <div className="stack">
            <Step n={1} title="Transaction and risk preview" done={!!preview}>
              <div className="row">
                <div><label htmlFor="tu">User ID</label>
                  <input id="tu" value={form.userId} onChange={set("userId")} disabled={!!preview}
                    placeholder="an enrolled user" /></div>
                <div><label htmlFor="ta">Amount (₹)</label>
                  <input id="ta" value={form.amount} onChange={set("amount")} disabled={!!preview}
                    inputMode="decimal" /></div>
              </div>
              <div className="row">
                <div><label htmlFor="tp">Payee ID</label>
                  <input id="tp" value={form.payeeId} onChange={set("payeeId")} disabled={!!preview} /></div>
                <div><label htmlFor="td">Device ID</label>
                  <input id="td" value={form.deviceId} onChange={set("deviceId")} disabled={!!preview} /></div>
              </div>
              <div className="row">
                <div><label htmlFor="ti">IP address</label>
                  <input id="ti" value={form.ip} onChange={set("ip")} disabled={!!preview} /></div>
                <div><label htmlFor="tc">Channel</label>
                  <select id="tc" value={form.channel} onChange={set("channel")} disabled={!!preview}>
                    <option>WEB</option><option>MOBILE</option></select></div>
              </div>
              <div className="row">
                <div><label>This device</label>
                  <InputPicker value={input} onChange={setInput} disabled={!!preview} /></div>
                <div><label htmlFor="tt">Who is testing (team test)</label>
                  <input id="tt" value={tester} onChange={e => setTester(e.target.value)}
                    disabled={!!result} placeholder="your own user ID" {...plainText} /></div>
              </div>
              {!preview && <div className="actions">
                <button className="go" onClick={assess} disabled={busy || !form.userId.trim()}>
                  {busy ? "Assessing" : "Assess risk"}</button></div>}

              {preview && (
                <div style={{ marginTop: 6 }}>
                  <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
                    <span className={"pill " + preview.band}>{preview.band} risk</span>
                    <span className="pill">{preview.status}</span>
                    <span className="hint" style={{ margin: 0 }}>
                      {preview.dimensionsUsed.length
                        ? `from ${preview.dimensionsUsed.join(" and ")}, confidence ${preview.confidence}`
                        : "no approved history yet, so treated as high"}</span>
                  </div>
                  <div className="flags">
                    <div><span>Device seen before</span><span>{yn(preview.flags.deviceSeenBefore)}</span></div>
                    <div><span>Location seen before</span><span>{yn(preview.flags.locationSeenBefore)}</span></div>
                    <div><span>Payee seen before</span><span>{yn(preview.flags.payeeSeenBefore)}</span></div>
                    <div><span>Unusual hour</span><span>{yn(preview.flags.hourUnusual)}</span></div>
                    <div><span>Many in the last hour</span><span>{yn(preview.flags.velocityHigh)}</span></div>
                    <div><span>Dormant account</span><span>{yn(preview.flags.dormant)}</span></div>
                  </div>
                  <p className="hint">This is what the decision engine receives. The IP address and
                    device ID stop here; the engine only ever sees these flags and the band.</p>
                </div>
              )}
            </Step>

            <Step n={2} title="Behavioural challenge" done={!!result} dim={!challenge}>
              {challenge && (<>
                {!challenge.inputEnrolled && <p className="err" style={{ marginTop: 0 }}>
                  {form.userId.trim()} has no {INPUT_LABEL[challenge.input].toLowerCase()} templates
                  {challenge.enrolledInputs.length ? ` (enrolled: ${challenge.enrolledInputs.map(k => INPUT_LABEL[k].toLowerCase()).join(", ")})` : ""}.
                  Verifying returns INSUFFICIENT_DATA, and the decision engine would use another
                  factor. Enrol this device type first to use it.</p>}
                <PhraseEcho phrase={challenge.phrase} typed={typed} />
                <input value={typed} {...plainText} disabled={!!result}
                  aria-label="Type the phrase" onChange={e => setTyped(e.target.value)}
                  onInput={kb.onInput}
                  onKeyDown={kb.onKeyDown} onKeyUp={kb.onKeyUp} placeholder="Type the phrase" />
                <div style={{ marginTop: 14 }}>
                  {!result && <TracePad shape={challenge.shape} aspect={challenge.aspectRatio}
                    input={challenge.input}
                    onTrace={(tr, k) => { setTrace(tr); setTraceKind(k); }} />}
                  <p className="hint">{trace ? "Trace captured. Draw again to replace it."
                    : "Trace the shape from the green dot to the red one."}</p>
                </div>
                {!result && <div className="arena">
                  <button className="go" style={{ top: target.top + "%", left: target.left + "%" }}
                    onClick={verify} disabled={busy}>{busy ? "Verifying" : "Verify"}</button>
                </div>}
                <p className="hint">Anything left out still counts. A skipped or half-finished
                  challenge is scored toward an impostor, not ignored.</p>
              </>)}
              {!challenge && <p className="hint">Unlocks after the risk preview.</p>}
            </Step>
            {error && <div className="err">{error}</div>}
          </div>

          <div className="stack">
            <Step n={3} title="Factor result" done={!!result} dim={!result}>
              {!result && <p className="hint">The response in the shared factor contract appears here.</p>}
              {result && (<>
                <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                  <span className="big">{result.score === null ? "none" : result.score.toFixed(3)}</span>
                  <span className={"pill " + result.status}>{result.status}</span>
                </div>
                {result.failureReason && <p className="hint">Reason: {result.failureReason}</p>}
                <p className="hint">Scored against the {INPUT_LABEL[result.detail.input || input].toLowerCase()} templates
                  {result.detail.provisional ? ", with provisional calibration borrowed from keyboard and mouse until real touch measurements are fitted" : ""}
                  {result.detail.shadow ? ". Shadow mode: recorded for measurement, not used for the decision" : ""}.</p>
                <ScoreBar score={result.score} threshold={result.threshold} />
                <table style={{ marginTop: 14 }}>
                  <thead><tr><th>Part</th><th>Status</th><th>Coverage</th><th>P(impostor)</th></tr></thead>
                  <tbody>
                    {["keystroke", "shape", "mouse"].map(k => {
                      const d = result.detail[k] || {};
                      return (
                        <tr key={k}>
                          <td>{k === "keystroke" ? "Typing" : k === "shape" ? "Shape trace" : "Mouse"}
                            {d.excludedFromScore && <div className="hint" style={{ margin: 0 }}>reported, not scored</div>}</td>
                          <td><span className={"pill " + d.status}>{d.status}</span></td>
                          <td className="mono">{d.coverage ?? "n/a"}</td>
                          <td className="mono">{d.probability ?? "n/a"}</td>
                        </tr>);
                    })}
                  </tbody>
                </table>
                <p className="hint">Score is 1 − P(impostor) from typing and shape combined.
                  Transaction risk is not counted here; it already shaped the decision in step 1.</p>
              </>)}
            </Step>

            <Step n={4} title="Record the outcome" done={!!commit} dim={!result}>
              {!commit && (<>
                <p className="hint" style={{ marginTop: 0 }}>In production the orchestrator reports
                  how the session ended. Here you play that role. Only an approved transaction
                  becomes part of this user's normal behaviour.</p>
                <div className="actions">
                  <button className="go" onClick={() => record("APPROVED")} disabled={!result || busy}>
                    Approve and record</button>
                  <button className="ghost" onClick={() => record("BLOCKED")} disabled={!result || busy}>
                    Block</button>
                </div>
              </>)}
              {commit && (<>
                <div className="check">
                  <div><span>Outcome</span><span>{commit.outcome}</span></div>
                  <div><span>Added to history</span><span className={commit.written ? "good" : ""}>
                    {commit.written ? "yes" : "no"}</span></div>
                  <div><span>Approved transactions</span><span className="num">{commit.eventsNow}</span></div>
                  <div><span>Sessions</span><span className="num">{commit.sessionsNow}</span></div>
                </div>
                {commit.reason && <p className="hint">{commit.reason}</p>}
                <div className="actions"><button className="go" onClick={again}>New transaction</button></div>
              </>)}
            </Step>
          </div>
        </div>
      );
    }

    /* History ------------------------------------------------------------ */

    function History() {
      const [rows, setRows] = useState([]);
      const [kind, setKind] = useState("all");
      const load = () => get("/history?limit=50").then(r => r.ok && setRows(r.data.verifications));
      useEffect(() => { load(); }, []);
      const kindOf = (r) => r.dimensions?.kind || "legacy";
      const shown = rows.filter(r => kind === "all" || kindOf(r) === kind);

      return (
        <section className="panel">
          <div style={{ display: "flex", justifyContent: "space-between", gap: 10, flexWrap: "wrap" }}>
            <div className="filter">
              {[["all", "All"], ["preview", "Risk previews"], ["factor", "Factor checks"]].map(([k, l]) =>
                <button key={k} className={kind === k ? "go" : "ghost"} onClick={() => setKind(k)}>{l}</button>)}
            </div>
            <button className="ghost" onClick={load}>Refresh</button>
          </div>
          {shown.length === 0 ? <p className="hint">Nothing recorded yet. Enrol a user and run a transaction.</p> : (
            <table>
              <thead><tr><th>When</th><th>User</th><th>Device</th><th>Check</th><th>Result</th>
                <th>Score</th><th>Detail</th><th>ms</th></tr></thead>
              <tbody>{shown.map(r => {
                const d = r.dimensions || {}, k = kindOf(r);
                return (
                  <tr key={r.id}>
                    <td className="mono">{new Date(r.decided_at * 1000).toLocaleTimeString()}</td>
                    <td>{r.user_id}{d.testerId && d.testerId !== r.user_id &&
                      <div className="hint" style={{ margin: 0 }}>tested by {d.testerId}</div>}</td>
                    <td>{d.input ? INPUT_LABEL[d.input] : ""}</td>
                    <td>{k === "preview" ? "Risk preview" : k === "factor" ? "Factor check" : "Legacy"}</td>
                    <td><span className={"pill " + (k === "preview" ? r.band : r.decision)}>
                      {k === "preview" ? r.band : r.decision}</span></td>
                    <td className="mono">{k === "factor" ? (d.score ?? "none")
                      : r.risk_prob === null ? "none" : `risk ${r.risk_prob}`}</td>
                    <td className="hint" style={{ margin: 0 }}>{k === "factor"
                      ? (d.failureReason || ["keystroke", "shape"].map(x => `${x} ${d[x]?.status ?? ""}`).join(", "))
                      : k === "preview" ? `${d.eventsSeen ?? 0} approved before` : ""}</td>
                    <td className="mono">{r.latency_ms}</td>
                  </tr>);
              })}</tbody>
            </table>
          )}
        </section>
      );
    }

    /* App ---------------------------------------------------------------- */

    function App() {
      const [tab, setTab] = useState("enroll");
      const [meta, setMeta] = useState(null);
      const [health, setHealth] = useState(null);
      const session = useSession();

      useEffect(() => {
        get("/enroll/phrase").then(r => r.ok && setMeta(r.data));
        get("/health").then(r => setHealth(r.ok ? r.data : { status: "down" }))
          .catch(() => setHealth({ status: "down" }));
      }, []);

      return (
        <div className="wrap">
          <header>
            <div>
              <h1>Behavioural verification</h1>
              <p>Typing rhythm and shape tracing, scored against each person's own enrollment.</p>
            </div>
            {health && (
              <div className="strip" aria-label="Service status">
                <span className={"chip " + (health.status === "up" ? "live" : "down")}>
                  service <b>{health.status === "up" ? "live" : health.status}</b></span>
                {health.factor && <span className="chip">factor <b>{health.factor}</b></span>}
                {health.threshold && <span className="chip">pass at <b>{health.threshold}</b></span>}
                {health.modelVersion && <span className="chip"><b>{health.modelVersion}</b></span>}
                {health.touchMode && <span className="chip">touch <b>{health.touchMode}</b></span>}
              </div>
            )}
          </header>
          <nav>
            {[["enroll", "Enroll"], ["transact", "Transact"], ["history", "History"]].map(([k, l]) =>
              <button key={k} className={tab === k ? "on" : ""}
                onClick={() => { setTab(k); session.mark(); }}>{l}</button>)}
          </nav>
          {!meta ? <p className="hint">Connecting to the service.</p> : <>
            {tab === "enroll" && <Enroll meta={meta} session={session} goTransact={() => setTab("transact")} />}
            {tab === "transact" && <Transact session={session} />}
            {tab === "history" && <History />}
          </>}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>

</html>
