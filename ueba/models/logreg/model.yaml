name: logreg
version: "1.0.0"
framework: scikit-learn
description: >
  Supervised logistic regression baseline. Exists to quantify what the
  unsupervised approach gives up, not as the primary model -- production
  has no fraud labels at decision time.

expected_features:
  - amount_zscore
  - txn_velocity_1h
  - is_new_device
  - is_new_location
  - hour_unusual
  - is_new_beneficiary
  - days_since_last_txn

hyperparameters:
  class_weight: balanced
  max_iter: 1000
  random_state: 42
