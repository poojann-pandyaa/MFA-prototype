name: sdk

# Builds the Python bank SDK (sdk/python, installable as amfa-client) so a bank can pip install it.
#   - every push or pull request that touches sdk/python: build the package, test the built wheel in a clean environment,
#     keep the files as a workflow artifact
#   - a tag like sdk-v1.2.0: also publishes the wheel and source package on a GitHub Release (Releases > Assets)
#   - "Run workflow" by hand: builds and tests only
on:
  push:
    branches: [integration, main]
    tags: ["sdk-v*"]
    paths: ["sdk/python/**", ".github/workflows/sdk.yml"]
  pull_request:
    paths: ["sdk/python/**", ".github/workflows/sdk.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # attach the files to a release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        run: sed -i "s/^version = .*/version = \"${GITHUB_REF#refs/tags/sdk-v}\"/" sdk/python/pyproject.toml

      - name: Build
        run: pip install build && python -m build sdk/python

      - name: Test the built wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install sdk/python/dist/*.whl
          "$RUNNER_TEMP/clean/bin/python" -I sdk/python/check_sdk.py

      - uses: actions/upload-artifact@v4
        with:
          name: amfa-client
          path: sdk/python/dist/*

      - name: Publish on the release
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        uses: softprops/action-gh-release@v2
        with:
          files: sdk/python/dist/*
          generate_release_notes: true
          body: |
            Python SDK for banks. Install: `pip install amfa_client-<version>-py3-none-any.whl` (the file below),
            or `pip install "amfa-client @ git+https://github.com/${{ github.repository }}@${{ github.ref_name }}#subdirectory=sdk/python"`.
            Usage: sdk/python/README.md.
