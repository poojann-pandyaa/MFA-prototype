name: ci
on:
  push:
    branches: [integration, main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # Voice requirements (requirements/voice.txt) are added when its tests are ported.
      - run: pip install -r requirements/base.txt -r requirements/face.txt -r requirements/ueba.txt pytest
      - run: python -m pytest
