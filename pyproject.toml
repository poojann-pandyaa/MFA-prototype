[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-mfa"
version = "1.0.0"
description = "Adaptive, risk-based multi-factor authentication for transaction authorisation"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "sqlalchemy>=2.0",
  "cryptography>=43",
  "argon2-cffi>=23",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "qrcode>=7.4",
  "maxminddb>=2.6",
  "python-multipart>=0.0.9",
  "cbor2>=5.6",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
redis = ["redis>=5.0"]
agent-local = ["llama-cpp-python>=0.3"]
agent-hosted = ["anthropic>=0.40"]
face = ["opencv-python-headless==4.11.0.86", "onnxruntime>=1.18", "pillow>=10.4"]
voice = ["torch>=2.2", "torchaudio>=2.2", "speechbrain>=1.0", "soundfile>=0.12", "scipy>=1.11", "vosk>=0.3.45"]
ueba = ["scikit-learn>=1.5", "pandas>=2.2", "joblib>=1.4", "scipy>=1.11"]
dev = ["pytest>=8.3"]

[project.scripts]
amfa = "amfa.cli:main"

[tool.setuptools.packages.find]
include = ["amfa*"]

[tool.setuptools.package-data]
"amfa" = ["**/*.html", "**/*.js", "**/*.css", "**/*.svg", "**/*.yaml", "**/*.json", "**/*.prototxt", "**/*.pem", "**/*.sha256"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "models: needs the real model weights under models/ (skipped when absent)",
]
